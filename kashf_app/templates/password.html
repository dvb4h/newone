{% extends "base.html" %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block body %}
<div style="min-height:100vh;display:grid;place-items:center;padding:16px">
  <div class="card" style="width:100%;max-width:400px;padding:28px">
    <div class="brand" style="margin-bottom:22px"><div class="emb">ك</div><div><b>تغيير كلمة المرور</b><span>{{ g.user.username }}</span></div></div>
    {% include "_flash.html" %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div style="margin-bottom:14px"><label>كلمة المرور الحالية</label><input name="current" type="password" required autocomplete="current-password"></div>
      <div style="margin-bottom:14px"><label>كلمة المرور الجديدة</label><input name="new" type="password" required minlength="6" autocomplete="new-password"></div>
      <div style="margin-bottom:20px"><label>تأكيد كلمة المرور الجديدة</label><input name="confirm" type="password" required minlength="6" autocomplete="new-password"></div>
      <div style="display:flex;gap:8px"><button class="btn gold" style="flex:1">حفظ</button><a class="btn" href="{{ url_for('admin') if g.user.role == 'admin' else url_for('index') }}">رجوع</a></div>
    </form>
  </div>
</div>
{% endblock %}
