<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<title>{% block title %}منصة الكشف الكمركي{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--card:rgba(20,23,28,.82);--card2:rgba(28,32,39,.7);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--text:#eceef1;--muted:#8a919a;--gold:#d4a54e;--gold2:#f1cd85;--gold-soft:rgba(212,165,78,.14);--ok:#41cf8f;--warn:#f1cd85;--bad:#ff6b5b;
--ui:"IBM Plex Sans Arabic",Tahoma,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;--r:12px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;
background-image:radial-gradient(ellipse 60% 50% at 20% 0%,rgba(212,165,78,.14),transparent 70%),radial-gradient(ellipse 50% 50% at 90% 100%,rgba(40,120,140,.12),transparent 70%)}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px}
.emb{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);border:1px solid rgba(212,165,78,.35);color:var(--gold2);font-weight:700;font-size:20px;flex:none}
.brand b{display:block;font-size:16px}.brand span{font-size:12px;color:var(--muted)}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:500}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,165,78,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;color:var(--text);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:rgba(255,255,255,.28);background:rgba(40,45,54,.8)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305;border-color:transparent;font-weight:700}
.btn.gold:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:rgba(255,107,91,.35)}
.btn.danger:hover{background:rgba(255,107,91,.12)}
.flash{padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13.5px;border:1px solid}
.flash.success{background:rgba(65,207,143,.1);border-color:rgba(65,207,143,.3);color:var(--ok)}
.flash.error,.flash.message{background:rgba(255,107,91,.1);border-color:rgba(255,107,91,.3);color:var(--bad)}
.mono{font-family:var(--mono)}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
