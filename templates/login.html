<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة التعرفة الجمركية الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .emblem-glow { filter: drop-shadow(0 0 15px rgba(234, 179, 8, 0.3)); }
        .login-glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-900/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
    </div>

    <header class="text-center mb-6 z-10">
        <div class="w-20 h-20 mx-auto mb-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center emblem-glow">
            <i class="fa-solid fa-shield-halved text-3xl text-amber-400"></i>
        </div>
        <h1 class="text-xl md:text-2xl font-black text-amber-400 tracking-wide mb-1">المنصة الذكية للتعرفة الجمركية</h1>
        <div class="inline-block px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-slate-300 text-xs font-semibold tracking-wide">
            نظام الاشتراكات
        </div>
    </header>

    <div class="w-full max-w-md login-glass-panel rounded-2xl p-6 z-10">
        <div class="flex items-center gap-3 mb-5 border-b border-slate-700/60 pb-3">
            <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-sm">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-sm font-bold text-white">تسجيل الدخول</h2>
                <p class="text-[11px] text-slate-400">أدخل اسم المستخدم وكلمة المرور</p>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4 p-2.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">اسم المستخدم</label>
                <input type="text" name="username" required autofocus
                    class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all"
                    placeholder="اسم المستخدم">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">كلمة المرور</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 text-xs">
                <span>تسجيل الدخول</span>
                <i class="fa-solid fa-arrow-left-long"></i>
            </button>
        </form>
    </div>

    <p class="text-slate-500 text-[11px] mt-6 z-10">تصميم وتطوير: الأستاذ حسين بدر</p>
</body>
</html>
