<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - منصة التعرفة الجمركية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-900/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
    </div>

    <header class="text-center mb-6 z-10">
        <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center">
            <i class="fa-solid fa-key text-2xl text-amber-400"></i>
        </div>
        <h1 class="text-lg md:text-xl font-black text-amber-400 tracking-wide">تغيير كلمة المرور</h1>
        <p class="text-xs text-slate-400 mt-1">مرحباً {{ session.username }}</p>
    </header>

    <div class="w-full max-w-md glass-panel rounded-2xl p-6 z-10">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-xl text-sm font-bold text-center
                        {% if category == 'error' %} bg-red-500/10 border border-red-500/20 text-red-400
                        {% else %} bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('change_password') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">كلمة المرور الحالية</label>
                <input type="password" name="current_password" required
                    class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all"
                    placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">كلمة المرور الجديدة</label>
                <input type="password" name="new_password" required minlength="4"
                    class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all"
                    placeholder="••••••••">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">تأكيد كلمة المرور الجديدة</label>
                <input type="password" name="confirm_password" required minlength="4"
                    class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all"
                    placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 text-xs">
                <span>حفظ كلمة المرور الجديدة</span>
                <i class="fa-solid fa-check"></i>
            </button>
        </form>

        <a href="{{ url_for('admin_dashboard') if session.role == 'admin' else url_for('dashboard') }}"
           class="mt-4 flex items-center justify-center gap-2 text-slate-400 hover:text-amber-400 text-xs font-bold transition-colors">
            <i class="fa-solid fa-arrow-right"></i>
            <span>الرجوع للوحة التحكم</span>
        </a>
    </div>
</body>
</html>
